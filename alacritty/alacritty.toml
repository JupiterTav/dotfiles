# Defaults are commented out. See `man 5 alacritty` for details.

[general]
import = [
    "~/dotfiles/alacritty/themes/themes/one_dark.toml",
]
#import = [
#  "~/.config/alacritty/catppuccin-mocha.toml",
#  "~/.config/alacritty/keybindings.toml",
#]
#working_directory     = "None"
#live_config_reload    = true
#ipc_socket            = true

[env]
TERM                  = "xterm-256color"

[window]
padding               = { x = 0, y = 0 }
#dynamic_padding       = false
decorations           = "None"
opacity               = 1.0
blur                  = true
#startup_mode          = "Windowed"
#title                 = "Alacritty"
#dynamic_title         = true
#class                 = { instance = "Alacritty", general = "Alacritty" }
#decorations_theme_variant = "None"
#resize_increments     = false
#option_as_alt         = "None"
#level                 = "Normal"

[scrolling]
history               = 65535
#multiplier            = 3

[font]
normal                = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold                  = { family = "JetBrainsMono Nerd Font Propo", style = "Bold" }
italic                = { family = "JetBrainsMonoNL Nerd Propo", style = "Italic" }
bold_italic           = { family = "JetBrainsMonoNL Nerd Propo", style = "Bold Italic" }
#size                  = 11.25
offset                = { x = 0, y = 0 }
glyph_offset          = { x = 0, y = 0 }
builtin_box_drawing   = true

[colors]
draw_bold_text_with_bright_colors = true

[bell]
animation             = "EaseOutExpo"
duration              = 0
color                 = "#C0C5CE"
command               = { program = "notify-send", args = ["alacritty", "bell",] }

[selection]
#semantic_escape_chars = ",│‘|:\"' ()[]{}<>\t"
save_to_clipboard     = true

[cursor.style]
shape                 = "Beam"
blinking              = "Always"

[cursor.vi_mode_style]
shape                 = "Block"
blinking              = "Off"

[cursor]
blink_interval        = 500
blink_timeout         = 0
#unfocused_hollow      = true
#thickness             = 0.15

[mouse]
hide_when_typing      = true
bindings = [
  { mouse = "Middle", action = "PasteSelection", mode = "~Vi" },
]

[hints]
#alphabet              = "jfkdls;ahgurieowpq"

[[hints.enabled]]
command               = "xdg-open"
## command             = "open" # On macOS
## command             = { program = "cmd", args = [ "/c", "start", "" ] } # On Windows
#hyperlinks            = true
post_processing       = true
#persist               = false
#mouse.enabled         = true
#binding               = { key = "O", mods = "Control|Shift" }
regex                 = "(ipfs:|ipns:|magnet:|mailto:|gemini://|gopher://|https://|http://|news:|file:|git://|ssh:|ftp://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩‘\\\\]+"

[keyboard]
bindings = [
  { key = "Paste",                            action = "Paste" },
  { key = "Copy",                             action = "Copy" },
  { key = "L",        mods = "Control",       action = "ClearLogNotice" },
  { key = "Paste",                            action = "Paste",              mode = "Vi|Search" },
  { key = "L",        mods = "Control",       chars  = "\f",                mode = "~Vi|~Search" },
  { key = "PageUp",   mods = "Shift",         action = "ScrollPageUp",      mode = "~Alt" },
  { key = "PageDown", mods = "Shift",         action = "ScrollPageDown",    mode = "~Alt" },
  { key = "Home",     mods = "Shift",         action = "ScrollToTop",       mode = "~Alt" },
  { key = "End",      mods = "Shift",         action = "ScrollToBottom",    mode = "~Alt" },
  { key = "V",        mods = "Control|Shift", action = "Paste",              mode = "~Vi" },
  { key = "V",        mods = "Control|Shift", action = "Paste",              mode = "Vi|Search" },
  { key = "C",        mods = "Control|Shift", action = "Copy" },
  { key = "F",        mods = "Control|Shift", action = "SearchForward",      mode = "~Search" },
  { key = "B",        mods = "Control|Shift", action = "SearchBackward",     mode = "~Search" },
  { key = "C",        mods = "Control|Shift", action = "ClearSelection",     mode = "Vi|~Search" },
  { key = "Insert",   mods = "Shift",         action = "PasteSelection" },
  { key = "0",        mods = "Control",       action = "ResetFontSize" },
  { key = "=",        mods = "Control",       action = "IncreaseFontSize" },
  { key = "+",        mods = "Control",       action = "IncreaseFontSize" },
  { key = "NumpadAdd", mods = "Control",      action = "IncreaseFontSize" },
  { key = "-",        mods = "Control",       action = "DecreaseFontSize" },
  { key = "NumpadSubtract", mods = "Control", action = "DecreaseFontSize" },
]


[debug]
#render_timer          = false
#persistent_logging    = false
#log_level             = "Warn"
#renderer              = "None"
#print_events          = false
#highlight_damage      = false
#prefer_egl            = false

